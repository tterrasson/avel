[workspace]
resolver = "3"
members = ["crates/avel-cli", "crates/avel-compiler", "crates/avel-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tterrasson/avel"
readme = "README.md"

[workspace.dependencies]
avel-compiler = { version = "0.1.0", path = "crates/avel-compiler" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tsify = "0.5"
# Must match the wasm-bindgen-cli version used by scripts/build-wasm.sh.
wasm-bindgen = "=0.2.130"

# Tuned for download size: the WebGPU compiler runs off the hot path.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.cpu]
inherits = "release"
opt-level = 3
