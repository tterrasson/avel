[project]
name = "avel-export"
version = "0.1.0"
description = "Exports PyTorch models to the avel format"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "numpy",
    "safetensors>=0.8",
    "torch>=2.15",
]

[project.urls]
Repository = "https://github.com/tterrasson/avel"

[project.optional-dependencies]
census = [
    "timm>=1.0.31",
    "transformers>=5.22.1",
]

[dependency-groups]
dev = [
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "pytest>=8",
    "ruff>=0.17.5",
    "torch>=2.15",
    "torchvision>=0.29.2",
]

# CPU wheels for this repository's own dev environment only: scoped to the dev group so
# that projects depending on avel-export pick their own torch build (CPU, CUDA, Metal).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'", group = "dev" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'", group = "dev" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avel_export"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: exports the full validation corpus or invokes the ONNX toolchain"]
